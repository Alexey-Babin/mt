services:
  nllb-server:
    container_name: nllb-api

    build:
      context: ./nllb-server
      dockerfile: Dockerfile.dev

    environment:
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      DEBUG: 1

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./models:/app/models
      - ./cache:/root/.cache    # Кэш huggingface
      # Live reload
      - ./nllb-server:/app
    
    restart: unless-stopped
